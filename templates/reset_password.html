<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set new password - Solo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: "Inter", system-ui, sans-serif; color: #ffffff; background: #0a0a0a; }
      .auth-page { background: #0a0a0a; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
      .brand-panel { background: #0a0a0a; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 64px; min-height: 100vh; border-right: 1px solid #161616; }
      .logo-row { display: flex; align-items: center; gap: 10px; }
      .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: #ffffff; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 2px 12px rgba(0,0,0,0.5); }
      .logo-text { font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
      .quote-mark { display: block; font-size: 96px; font-weight: 900; color: #1a1a1a; line-height: 0.8; margin-bottom: -8px; font-family: Georgia, serif; }
      .quote-text { font-size: 24px; font-weight: 600; color: #ffffff; line-height: 1.35; max-width: 360px; letter-spacing: -0.02em; margin: 0; }
      .quote-byline { font-size: 14px; color: #585858; margin-top: 16px; line-height: 1.6; }
      .feature-pills { display: flex; gap: 8px; flex-wrap: wrap; }
      .feature-pill { background: #141414; border: 1px solid #242424; border-radius: 99px; padding: 6px 16px; font-size: 12.5px; color: #737373; }
      .form-panel { background: #101010; display: flex; align-items: center; justify-content: center; padding: 56px 64px; min-height: 100vh; }
      .form-container { width: 380px; max-width: 100%; }
      .form-title { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: #ffffff; margin: 0 0 8px; }
      .form-subtitle { font-size: 14px; color: #737373; margin: 0 0 32px; }
      .auth-form { display: flex; flex-direction: column; gap: 16px; }
      .field-label { font-size: 12.5px; font-weight: 500; color: #a0a0a0; display: block; margin-bottom: 6px; }
      .auth-error { background: #160808; border: 1px solid #3d1515; border-radius: 9px; padding: 12px 16px; font-size: 13px; color: #f87171; margin-bottom: 16px; }
      .auth-submit { width: 100%; height: 44px; font-size: 14px; }
      @media (max-width: 768px) {
        .auth-page { grid-template-columns: 1fr; overflow: visible; }
        .brand-panel, .form-panel { min-height: auto; padding: 40px 24px; }
        .brand-panel { gap: 64px; border-right: 0; border-bottom: 1px solid #161616; }
      }
    </style>
  </head>
  <body>
    <main class="auth-page">
      <section class="brand-panel">
        <div class="logo-row">
          <div class="logo-mark" aria-hidden="true">S</div>
          <!-- LOGO replace this div with img src="/static/logo.png" height="28" -->
          <div class="logo-text">Solo</div>
        </div>
        <div>
          <span class="quote-mark">"</span>
          <p class="quote-text">Finally, a system that thinks like a founder.</p>
          <p class="quote-byline">Built for builders working solo.</p>
        </div>
        <div class="feature-pills">
          <span class="feature-pill">Task management</span>
          <span class="feature-pill">AI planning</span>
          <span class="feature-pill">Team handoff</span>
        </div>
      </section>

      <section class="form-panel">
        <div class="form-container">
          <h1 class="form-title">Set new password</h1>
          <p class="form-subtitle">Choose a strong password for your account.</p>
          {% if error %}
            <div class="auth-error">{{ error }}</div>
          {% endif %}
          <form class="auth-form" action="/reset-password" method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
            <label>
              <span class="field-label">New password</span>
              <input class="input" type="password" name="new_password" placeholder="At least 8 characters" required autocomplete="new-password">
            </label>
            <label>
              <span class="field-label">Confirm password</span>
              <input class="input" type="password" name="confirm_password" placeholder="Same password again" required autocomplete="new-password">
            </label>
            <button class="btn-primary auth-submit" type="submit">Update password -></button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
