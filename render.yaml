services:
  - type: web
    name: solo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: solo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: solo-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        value: ""

  - type: worker
    name: solo-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker solo_tasks
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: solo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: solo-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        value: ""

  - type: keyvalue
    name: solo-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: solo-db
    databaseName: solo
    user: solo
    plan: free
    ipAllowList: []
